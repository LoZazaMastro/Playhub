<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playhub Circles</title><style>
@font-face{font-family:"Motiva Sans";src:url("steam-ui-font.ttf") format("truetype");font-weight:500}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:white;font-family:"Motiva Sans",Helvetica,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:appear 1.5s ease forwards}.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.clock-row{display:flex;align-items:baseline;white-space:nowrap;font-size:16px;font-weight:500;line-height:36.8px;gap:0;transform:scale(2.25);text-shadow:0 2px 24px #000,0 0 48px #000;opacity:0;animation:appear 1.2s .15s ease forwards}#date{margin-left:.55em;margin-right:.34em}#weather{display:inline-flex;align-items:baseline;gap:.16em;margin-left:.34em}#weather-icon{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;font-size:calc(.82em + 5px);line-height:1;transform:translateY(.04em)}@keyframes appear{to{opacity:1}}@media(prefers-reduced-motion:reduce){canvas,.clock-row{animation-duration:.01s}}
</style></head><body><canvas id="circles"></canvas><div class="center"><div class="clock-row"><span id="clock"></span><span id="date"></span><span id="weather"><span id="weather-icon"></span><span id="weather-temp"></span></span></div></div><script src="main.js"></script></body></html>
